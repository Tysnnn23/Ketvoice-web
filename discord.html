<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d12">
<title>Ketvoice · Discord</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 0%, #1c2340 0%, #0d0d12 55%, #08080b 100%);
    color: #f5f6fa; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 28px;
  }
  main { width: min(420px, 100%); text-align: center; }
  .mark {
    width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 18px;
    display: grid; place-items: center; font-size: 30px; font-weight: 800;
    background: linear-gradient(145deg, #5865f2, #3b45c9);
    box-shadow: 0 12px 40px rgba(88, 101, 242, .45);
  }
  h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: -.02em; }
  p { color: #a8abb8; font-size: 14px; margin: 0 0 22px; }
  a.open {
    display: block; padding: 15px 18px; border-radius: 14px; text-decoration: none;
    background: #5865f2; color: #fff; font-weight: 650; letter-spacing: .01em;
    box-shadow: 0 10px 30px rgba(88, 101, 242, .35);
  }
  a.open:active { transform: scale(.98); }
  code { color: #d6d8e2; font-size: 12px; word-break: break-all; }
</style>
</head>
<body>
<main>
  <div class="mark">K</div>
  <h1>Connexion à Discord</h1>
  <p id="status">Retour vers Ketvoice…</p>
  <a class="open" id="open" href="ketvoice://discord">Ouvrir Ketvoice</a>
  <p style="margin-top:18px"><code id="detail"></code></p>
</main>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var code = params.get('code') || '';
  var state = params.get('state') || '';
  var error = params.get('error') || '';
  var status = document.getElementById('status');
  var open = document.getElementById('open');
  var detail = document.getElementById('detail');

  function target() {
    var q = new URLSearchParams();
    if (code) q.set('code', code);
    if (state) q.set('state', state);
    if (error) q.set('error', error);
    return 'ketvoice://discord?' + q.toString();
  }

  open.href = target();

  if (error) {
    status.textContent = "L'autorisation a été refusée (" + error + ").";
    detail.textContent = 'Tu peux fermer cette page et réessayer dans Ketvoice.';
    return;
  }
  if (!code) {
    status.textContent = 'Réponse Discord incomplète.';
    detail.textContent = 'Aucun code reçu. Relance la liaison depuis Ketvoice.';
    return;
  }

  // Browsers may block a custom-scheme navigation without a user gesture; try
  // automatically, then keep the explicit button as the guaranteed path.
  setTimeout(function () { location.href = target(); }, 60);
  setTimeout(function () {
    status.textContent = 'Si Ketvoice ne s’ouvre pas, appuie sur le bouton.';
  }, 1400);
})();
</script>
</body>
</html>
